{% macro pagination(page, total_pages, base_url) %}
{% if total_pages > 1 %}
<div class="pagination">
    {% if page > 1 %}
    <a href="{{ base_url }}?page={{ page - 1 }}" class="btn btn-sm">&larr; Anterior</a>
    {% endif %}

    <span class="pagination-info">{{ page }} / {{ total_pages }}</span>

    {% if page < total_pages %}
    <a href="{{ base_url }}?page={{ page + 1 }}" class="btn btn-sm">Siguiente &rarr;</a>
    {% endif %}
</div>
{% endif %}
{% endmacro %}
