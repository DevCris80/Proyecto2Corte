<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SISPRO{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="icon" type="image/webp" href="/static/favicon.webp">
    {% if supabase_host %}<link rel="preconnect" href="{{ supabase_host }}">{% endif %}
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="glow-ambient glow-1"></div>
    <div class="glow-ambient glow-2"></div>
    <div class="glow-ambient glow-3"></div>

    <div id="toast-container"></div>
    <div class="layout">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-row">
                    <h2><a href="/">SISPRO</a></h2>
                    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                </div>
            </div>
            <ul class="sidebar-nav">
                <li><a href="/" data-short="IN">Inicio</a></li>
                <li><a href="/dashboard" data-short="DB">Dashboard</a></li>
                <li><a href="/productos" data-short="PR">Productos</a></li>
                <li><a href="/proveedores" data-short="PV">Proveedores</a></li>
                <li><a href="/ventas" data-short="VT">Ventas</a></li>
                <li><a href="/optimizacion" data-short="OP">Optimización</a></li>
            </ul>
        </nav>
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <main class="main-content">
            <button class="hamburger" id="hamburgerBtn" aria-label="Menú">
                <span></span><span></span><span></span>
            </button>
            {% block content %}{% endblock %}
        </main>
    </div>
    <div id="modal-detalle" class="modal-overlay" data-modal="modal-detalle">
        <div class="modal modal-detail">
            <div class="modal-header">
                <h3 id="detalle-titulo"></h3>
                <button class="modal-close" onclick="window.closeModal('modal-detalle')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-card">
                    <div class="detail-image-col" id="detalle-imagen-col" style="display:none;">
                        <img id="detalle-imagen" src="" alt="">
                    </div>
                    <div class="detail-fields-col" id="detalle-campos"></div>
                </div>
                <div class="detail-actions" id="detalle-acciones">
                    <a id="detalle-btn-editar" class="btn btn-sm btn-ghost" href="">Editar</a>
                    <a id="detalle-btn-productos" class="btn btn-sm" href="" style="display:none;">Ver productos</a>
                    <form id="detalle-form-eliminar" method="POST" style="display:inline;" data-confirm="">
                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/main.js?v={{ range(1000, 9999) | random }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
