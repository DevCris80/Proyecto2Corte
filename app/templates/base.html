<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SISPRO{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="glow-ambient glow-1"></div>
    <div class="glow-ambient glow-2"></div>
    <div class="glow-ambient glow-3"></div>

    <div class="layout">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-row">
                    <h2><a href="/">SISPRO</a></h2>
                    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                </div>
            </div>
            <ul class="sidebar-nav">
                <li><a href="/" data-short="IN">Inicio</a></li>
                <li><a href="/dashboard" data-short="DB">Dashboard</a></li>
                <li><a href="/productos" data-short="PR">Productos</a></li>
                <li><a href="/proveedores" data-short="PV">Proveedores</a></li>
                <li><a href="/ventas" data-short="VT">Ventas</a></li>
                <li><a href="/optimizacion" data-short="OP">Optimización</a></li>
            </ul>
        </nav>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
